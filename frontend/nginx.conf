server {
    listen 80;
    root /usr/share/nginx/html;

    # nginx rejects bodies over 1 MB by default; match the backend's 100 MB upload limit.
    client_max_body_size 100m;

    # Docker's internal DNS, asked again every 10 s instead of once at startup,
    # so the proxy keeps working when the backend container is recreated
    # (for example after changing .env) and nginx can start before the backend.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Same origin for UI and API, so the browser needs no CORS setup.
    # Indexing a large PDF on the free API tier runs at about 100 passages per
    # minute (a 170-page manual took 150 s), so uploads may take several minutes.
    location /api/ {
        set $backend http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
