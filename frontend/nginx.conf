server {
    listen 80;
    root /usr/share/nginx/html;

    # nginx rejects bodies over 1 MB by default; match the backend's 20 MB upload limit.
    client_max_body_size 20m;

    # Same origin for UI and API, so the browser needs no CORS setup.
    # The trailing slash strips /api before forwarding.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri /index.html;
    }
}
